name: CI Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    name: Windows
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.51'
      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Verify Visual Studio 2026 environment
        shell: pwsh
        run: |
          if ($env:VisualStudioVersion -ne '18.0' -or $env:VCToolsVersion -notlike '14.51.*') {
            throw 'Visual Studio 2026 with MSVC v145 is required'
          }

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DVNM_MSDF_TEXT_BUILD_TESTS=ON
          -DVNM_MSDF_TEXT_FETCH_DEPS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        working-directory: build
        run: ctest -C Release --output-on-failure

  full-export:
    name: Windows full export
    runs-on: windows-2025-vs2026
    env:
      VCPKG_TARGET_TRIPLET: x64-windows

    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.51'
      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Verify Visual Studio 2026 environment
        shell: pwsh
        run: |
          if ($env:VisualStudioVersion -ne '18.0' -or $env:VCToolsVersion -notlike '14.51.*') {
            throw 'Visual Studio 2026 with MSVC v145 is required'
          }

      - name: Bootstrap vcpkg
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $env:VCPKG_ROOT = "$env:RUNNER_TEMP\vcpkg"
          "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$env:RUNNER_TEMP\vcpkg-archives"
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-File -FilePath $env:GITHUB_ENV -Append
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-freetype-msdfgen-ext-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-freetype-msdfgen-ext-

      - name: Install full-export dependencies
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: >
          & "$env:VCPKG_ROOT\vcpkg.exe" install
          "freetype:$env:VCPKG_TARGET_TRIPLET"
          "msdfgen[extensions]:$env:VCPKG_TARGET_TRIPLET"

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build-full-export
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET_TRIPLET"
          -DVNM_MSDF_TEXT_BUILD_TESTS=ON
          -DVNM_MSDF_TEXT_FETCH_DEPS=OFF

      - name: Build
        run: cmake --build build-full-export --config Release --parallel

      - name: Run tests
        working-directory: build-full-export
        run: ctest -C Release --output-on-failure
